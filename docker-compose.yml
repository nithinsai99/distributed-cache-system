version: "3.8"
services:
  redis:
    image: "redis:7"
    ports:
      - "6379:6379"
  seq:
    image: datalust/seq:latest
    ports:
      - "5341:80"
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORD: "SeqAdmin123!"
  redis-commander:
    image: rediscommander/redis-commander:latest
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
  api:
    build:
      context: .
      dockerfile: src/Cache.Api/Dockerfile
    ports:
      - "5001:8080"
    environment:
      Redis__Configuration: "redis:6379"
      Seq__Url: "http://seq:5341"
      ASPNETCORE_ENVIRONMENT: "Development"
    depends_on:
      - redis
      - seq
